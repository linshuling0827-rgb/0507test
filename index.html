<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員查詢系統</title>
    <!-- 引入 Tailwind CSS 以進行快速且美觀的網頁排版 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 隱藏捲軸但保留捲動功能 (為了表格的響應式設計) */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 font-sans p-4 sm:p-8">

    <div class="max-w-5xl mx-auto">
        <!-- 標題與搜尋區塊 -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 sm:p-8 mb-6">
            <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 mb-2">會員資料查詢</h1>
            <p class="text-gray-500 mb-6 text-sm">輸入使用者名稱並點擊查詢，系統將自動向伺服器請求資料。</p>
            
            <form id="searchForm" class="flex flex-col sm:flex-row gap-4">
                <div class="flex-1">
                    <label for="usernameInput" class="sr-only">使用者名稱</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
                            </svg>
                        </div>
                        <input type="text" id="usernameInput" 
                            class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-xl leading-5 bg-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition-colors" 
                            placeholder="請輸入使用者名稱 (例如: 陳美玲)">
                    </div>
                </div>
                <button type="submit" id="submitBtn" 
                    class="inline-flex justify-center items-center px-6 py-3 border border-transparent text-sm font-medium rounded-xl text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed w-full sm:w-auto">
                    <span>送出查詢</span>
                </button>
            </form>
            
            <!-- 訊息提示區塊 (錯誤或警告) -->
            <div id="messageBox" class="hidden mt-4 p-4 rounded-xl text-sm font-medium" role="alert"></div>
        </div>

        <!-- 載入中動畫 -->
        <div id="loadingIndicator" class="hidden flex flex-col justify-center items-center py-12">
            <svg class="animate-spin h-10 w-10 text-blue-600 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="text-gray-500 font-medium">正在向 Webhook 請求資料，請稍候...</p>
        </div>

        <!-- 查詢結果表格區塊 -->
        <div id="resultContainer" class="hidden bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-100 bg-gray-50/50 flex justify-between items-center">
                <h3 class="text-lg font-medium text-gray-900">查詢結果</h3>
                <span id="resultCount" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800">
                    0 筆資料
                </span>
            </div>
            
            <div class="overflow-x-auto no-scrollbar">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50" id="tableHead">
                        <!-- 表頭將由 JavaScript 動態生成 -->
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200" id="tableBody">
                        <!-- 表格內容將由 JavaScript 動態生成 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const webhookUrl = 'https://odtxiesb.roamerhost.com/webhook-test/42875d38-e490-4902-9997-04d396d926cf';
            
            // DOM 元素綁定
            const searchForm = document.getElementById('searchForm');
            const usernameInput = document.getElementById('usernameInput');
            const submitBtn = document.getElementById('submitBtn');
            const messageBox = document.getElementById('messageBox');
            const loadingIndicator = document.getElementById('loadingIndicator');
            const resultContainer = document.getElementById('resultContainer');
            const tableHead = document.getElementById('tableHead');
            const tableBody = document.getElementById('tableBody');
            const resultCount = document.getElementById('resultCount');

            // 處理表單送出事件
            searchForm.addEventListener('submit', async (e) => {
                e.preventDefault(); // 阻止表單預設的重整行為
                
                const username = usernameInput.value.trim();
                
                if (!username) {
                    showMessage('請輸入使用者名稱！', 'warning');
                    return;
                }

                // 初始化 UI 狀態
                hideMessage();
                resultContainer.classList.add('hidden');
                loadingIndicator.classList.remove('hidden');
                submitBtn.disabled = true;

                try {
                    // 將資料改為 URLSearchParams (表單) 格式，避免觸發瀏覽器的 OPTIONS Preflight (預檢請求)
                    // 這是 n8n Webhook 最常遇到 "Failed to fetch" 阻擋的主因
                    const formData = new URLSearchParams();
                    formData.append('username', username);

                    // 發送 POST 請求到 Webhook
                    const response = await fetch(webhookUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                        },
                        body: formData
                    });

                    if (!response.ok) {
                        throw new Error(`伺服器回應錯誤 (狀態碼: ${response.status})`);
                    }

                    // 解析回傳的 JSON 資料
                    const data = await response.json();
                    
                    // 渲染資料到表格
                    renderTable(data);
                    
                } catch (error) {
                    console.error('查詢錯誤:', error);
                    
                    let errorHint = '提示: 請確認伺服器是否有正確回應。';
                    if (error.message.includes('Failed to fetch')) {
                        errorHint = `
                            <strong>偵測到連線被阻擋 (Failed to fetch)，請確認 n8n 設定：</strong><br>
                            1. <strong>啟動監聽：</strong>因為您使用的是 <code>/webhook-test/</code>，請務必先在 n8n 點擊紅色的 <strong>「Listen for test event」</strong> 按鈕，再從網頁按下查詢。<br>
                            2. <strong>CORS 標頭：</strong>請在 n8n 的「Respond to Webhook」節點的 Options 或 Headers 設定中，加入一組 Header：<code>Access-Control-Allow-Origin</code> 值為 <code>*</code>
                        `;
                    }

                    showMessage(`查詢失敗：${error.message} <br><div class="text-xs font-normal mt-3 block text-gray-800 bg-white/60 p-3 rounded border border-red-200">${errorHint}</div>`, 'error');
                } finally {
                    // 恢復按鈕狀態與隱藏載入動畫
                    loadingIndicator.classList.add('hidden');
                    submitBtn.disabled = false;
                }
            });

            // 渲染表格內容函數
            function renderTable(data) {
                // 清空先前的內容
                tableHead.innerHTML = '';
                tableBody.innerHTML = '';

                // 將資料統一轉換為陣列格式以方便處理 (即使只有一筆)
                const dataArray = Array.isArray(data) ? data : [data];

                if (dataArray.length === 0 || Object.keys(dataArray[0]).length === 0) {
                    showMessage('查詢成功，但找不到相符的會員資料。', 'warning');
                    return;
                }

                // 取得所有資料鍵值作為表頭
                // (假設所有的物件都擁有相同的結構，取第一筆資料的 keys)
                const keys = Object.keys(dataArray[0]);

                // --- 產生表頭 ---
                const trHead = document.createElement('tr');
                keys.forEach(key => {
                    const th = document.createElement('th');
                    th.scope = 'col';
                    th.className = 'px-6 py-3 text-left text-xs font-bold text-gray-600 uppercase tracking-wider whitespace-nowrap';
                    th.textContent = key;
                    trHead.appendChild(th);
                });
                tableHead.appendChild(trHead);

                // --- 產生表格內容 ---
                dataArray.forEach((row, index) => {
                    const trBody = document.createElement('tr');
                    // 偶數列加上淺色背景以提高可讀性
                    if (index % 2 !== 0) {
                        trBody.classList.add('bg-gray-50');
                    }
                    trBody.classList.add('hover:bg-blue-50', 'transition-colors');

                    keys.forEach(key => {
                        const td = document.createElement('td');
                        td.className = 'px-6 py-4 whitespace-nowrap text-sm text-gray-700';
                        
                        // 處理可能為 null 或 undefined 的資料
                        let cellValue = row[key];
                        if (cellValue === null || cellValue === undefined) {
                            cellValue = '-';
                        }
                        
                        // 如果有特定欄位需要特殊樣式，可在此判斷，例如性別、ID
                        if (key === '會員ID') {
                            td.innerHTML = `<span class="font-mono font-medium text-blue-600">${cellValue}</span>`;
                        } else {
                            td.textContent = cellValue;
                        }
                        
                        trBody.appendChild(td);
                    });
                    tableBody.appendChild(trBody);
                });

                // 更新資料筆數並顯示表格區塊
                resultCount.textContent = `${dataArray.length} 筆資料`;
                resultContainer.classList.remove('hidden');
            }

            // 顯示訊息框
            function showMessage(msg, type = 'error') {
                messageBox.innerHTML = msg;
                messageBox.className = 'mt-4 p-4 rounded-xl text-sm font-medium block'; // Reset classes
                
                if (type === 'error') {
                    messageBox.classList.add('bg-red-50', 'text-red-800', 'border', 'border-red-200');
                } else if (type === 'warning') {
                    messageBox.classList.add('bg-yellow-50', 'text-yellow-800', 'border', 'border-yellow-200');
                }
                
                messageBox.classList.remove('hidden');
            }

            // 隱藏訊息框
            function hideMessage() {
                messageBox.classList.add('hidden');
                messageBox.innerHTML = '';
            }
        });
    </script>
</body>
</html>
