<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員資料查詢系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f3f4f6;
        }
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .hidden { display: none; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <!-- 查詢卡片 -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-8">
            <h1 class="text-2xl font-bold text-gray-800 mb-6">會員資料查詢</h1>
            
            <div class="flex flex-col md:flex-row gap-4">
                <div class="flex-grow">
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1">請輸入使用者名稱</label>
                    <input type="text" id="username" placeholder="例如：陳美玲" 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition">
                </div>
                <div class="flex items-end">
                    <button id="submitBtn" 
                        class="w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-8 rounded-lg transition transform active:scale-95 flex items-center justify-center">
                        <span id="btnLoader" class="loader hidden"></span>
                        <span id="btnText">送出查詢</span>
                    </button>
                </div>
            </div>
            
            <div id="messageBox" class="mt-4 p-3 rounded-lg hidden"></div>
        </div>

        <!-- 結果表格 -->
        <div id="resultContainer" class="bg-white rounded-xl shadow-md overflow-hidden hidden">
            <div class="p-4 border-b border-gray-100 bg-gray-50 flex justify-between items-center">
                <h2 class="font-semibold text-gray-700">查詢結果</h2>
                <span id="rowCount" class="text-xs bg-blue-100 text-blue-700 py-1 px-2 rounded-full font-medium"></span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-600 text-sm uppercase">
                            <th class="px-6 py-4 font-bold border-b">會員ID</th>
                            <th class="px-6 py-4 font-bold border-b">姓名</th>
                            <th class="px-6 py-4 font-bold border-b">英文名</th>
                            <th class="px-6 py-4 font-bold border-b">性別</th>
                            <th class="px-6 py-4 font-bold border-b">年齡</th>
                            <th class="px-6 py-4 font-bold border-b">電話</th>
                            <th class="px-6 py-4 font-bold border-b">地址</th>
                        </tr>
                    </thead>
                    <tbody id="resultBody" class="text-gray-700">
                        <!-- 資料將插入於此 -->
                    </tbody>
                </table>
            </div>
        </div>
        
        <!-- 初始狀態提示 -->
        <div id="emptyState" class="text-center py-20 text-gray-400">
            <svg class="w-16 h-16 mx-auto mb-4 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            <p>請輸入名稱並點擊按鈕開始查詢</p>
        </div>
    </div>

    <script>
        const WEBHOOK_URL = 'https://odtxiesb.roamerhost.com/webhook/bff377c7-09bc-4f3e-8a99-e797084ad30d';
        
        const usernameInput = document.getElementById('username');
        const submitBtn = document.getElementById('submitBtn');
        const btnLoader = document.getElementById('btnLoader');
        const btnText = document.getElementById('btnText');
        const resultContainer = document.getElementById('resultContainer');
        const resultBody = document.getElementById('resultBody');
        const messageBox = document.getElementById('messageBox');
        const emptyState = document.getElementById('emptyState');
        const rowCount = document.getElementById('rowCount');

        // 顯示訊息函式
        function showMessage(text, type = 'error') {
            messageBox.textContent = text;
            messageBox.className = `mt-4 p-3 rounded-lg ${type === 'error' ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`;
            messageBox.classList.remove('hidden');
        }

        // 查詢邏輯
        async function performSearch() {
            const username = usernameInput.value.trim();
            
            if (!username) {
                showMessage('請輸入使用者名稱');
                return;
            }

            // UI 狀態更新
            messageBox.classList.add('hidden');
            submitBtn.disabled = true;
            btnLoader.classList.remove('hidden');
            btnText.textContent = '查詢中...';

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        timestamp: new Date().toISOString()
                    })
                });

                if (!response.ok) {
                    throw new Error(`伺服器回應錯誤: ${response.status}`);
                }

                const data = await response.json();
                displayResults(data);

            } catch (error) {
                console.error('Fetch Error:', error);
                showMessage(`查詢失敗：${error.message}`);
                resultContainer.classList.add('hidden');
                emptyState.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                btnLoader.classList.add('hidden');
                btnText.textContent = '送出查詢';
            }
        }

        // 渲染結果表格
        function displayResults(data) {
            // 清空舊內容
            resultBody.innerHTML = '';
            
            // 判斷回傳資料是否為陣列或單一物件
            const dataList = Array.isArray(data) ? data : [data];
            
            if (dataList.length === 0 || !dataList[0].會員ID) {
                showMessage('查無相關資料');
                resultContainer.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            dataList.forEach(item => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-blue-50 transition border-b border-gray-100';
                
                row.innerHTML = `
                    <td class="px-6 py-4 font-mono text-sm text-blue-600">${item.會員ID || '-'}</td>
                    <td class="px-6 py-4 font-medium">${item.姓名 || '-'}</td>
                    <td class="px-6 py-4">${item.英文名 || '-'}</td>
                    <td class="px-6 py-4">
                        <span class="${item.性別 === '男' ? 'text-blue-500' : 'text-pink-500'} font-bold">
                            ${item.性別 || '-'}
                        </span>
                    </td>
                    <td class="px-6 py-4">${item.年齡 || '-'} 歲</td>
                    <td class="px-6 py-4 text-sm">${item.電話 || '-'}</td>
                    <td class="px-6 py-4 text-sm text-gray-500 max-w-xs truncate" title="${item.地址}">
                        ${item.地址 || '-'}
                    </td>
                `;
                resultBody.appendChild(row);
            });

            // 顯示結果面板
            rowCount.textContent = `找到 ${dataList.length} 筆資料`;
            resultContainer.classList.remove('hidden');
            emptyState.classList.add('hidden');
        }

        // 綁定事件
        submitBtn.addEventListener('click', performSearch);
        
        usernameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });
    </script>
</body>
</html>
